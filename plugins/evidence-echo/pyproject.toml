[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evidence-echo"
version = "0.15.1"
description = "Evidence-graded research digests from the feeds you follow (engine of the Evidence Echo Claude Code plugin)"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "r-hural" }]
dependencies = [
  "feedparser>=6.0",
  "httpx>=0.27",
  "httpcore>=1.0",
  "anthropic>=0.40",
  "python-dateutil>=2.9",
  "trafilatura>=2.2",
  "numpy>=2.1",
]

[project.urls]
Homepage = "https://github.com/r-hural/evidence-echo"
Issues = "https://github.com/r-hural/evidence-echo/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
evidence-echo = "evidence_echo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_echo"]
