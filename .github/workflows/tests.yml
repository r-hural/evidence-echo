name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install engine
        run: python -m pip install -e "plugins/evidence-echo[dev]"
      - name: Run tests
        # pytest.ini excludes the slow marker (real venv builds over the network)
        run: python -m pytest -q
